spring.application.name=DataLoader

# Change the embedded web server port to avoid conflicts with Kafka UI
server.port=8081

# Database Connection Settings
spring.datasource.url=jdbc:h2:mem:payroll_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot 4 H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Boot 4 specific property to allow dashboard frame rendering
spring.h2.console.settings.web-allow-others=true

# Disable Spring Batch running all jobs automatically on startup
spring.batch.job.enabled=false

# Allow H2 to store Spring Batch metadata tables in memory
spring.batch.jdbc.initialize-schema=always

# Custom property to switch loader strategy: "iterator" or "batch"
app.loader.strategy=batch

# Kafka Bootstrap Servers (Points to Docker localhost)
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Optional: Ensure the framework doesn't add type headers to JSON if other non-Java consumers read the topic
# spring.kafka.producer.properties.spring.json.add.type.headers=false