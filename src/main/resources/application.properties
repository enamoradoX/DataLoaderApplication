spring.application.name=DataLoader

# Database Connection Settings
spring.datasource.url=jdbc:h2:mem:payroll_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot 4 H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Boot 4 specific property to allow dashboard frame rendering
spring.h2.console.settings.web-allow-others=true