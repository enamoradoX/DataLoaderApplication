spring.application.name=DataLoader

# Change the embedded web server port to avoid conflicts with Kafka UI
server.port=8081

# Database Connection Settings
spring.datasource.url=jdbc:h2:mem:payroll_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot 4 H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Boot 4 specific property to allow dashboard frame rendering
spring.h2.console.settings.web-allow-others=true

# Disable Spring Batch running all jobs automatically on startup
spring.batch.job.enabled=false

# Allow H2 to store Spring Batch metadata tables in memory
spring.batch.jdbc.initialize-schema=always

# Custom property to switch loader strategy: "iterator" or "batch"
app.loader.strategy=batch

# Kafka Bootstrap Servers (Points to Docker localhost)
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Optional: Ensure the framework doesn't add type headers to JSON if other non-Java consumers read the topic
# spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer group + offset reset for the skip-event email notifier.
# These are read by the explicit ConsumerFactory bean in KafkaConfiguration (deserializers are defined there too).
spring.kafka.consumer.group-id=skip-event-email-notifier
spring.kafka.consumer.auto-offset-reset=earliest

# ----- Mail (SMTP) Configuration: send through Gmail -----
# Credentials come from environment variables so the App Password is never committed to git.
# Set MAIL_USERNAME to your full Gmail address and MAIL_APP_PASSWORD to a 16-char Google App
# Password (NOT your normal login password). See setup steps below.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----- Skip-event notification settings -----
# Toggle email sending without touching code; "from" and "to" addresses for alert emails.
# Gmail requires "from" to be the authenticated account (or one of its configured aliases).
# The ":" empty defaults let the app context start when the env vars are not set (tests, CI,
# teammates) -- with enabled=false nothing is sent anyway.
app.notifications.email.enabled=true
app.notifications.email.from=${MAIL_USERNAME:}
app.notifications.email.to=${MAIL_USERNAME:}
# Base URL of the review-and-reprocess page the digest email links to (Angular /skips/{loadId} route).
# Dev: Angular dev server on :4200 (ng serve). Point this at wherever the built UI is hosted in prod.
app.notifications.email.skips-base-url=http://localhost:4200/skips

# ----- File upload / drag-and-drop imports -----
# Cap upload size so a huge file can't OOM the app.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Directory where uploaded import files are saved before the job reads them (relative to the
# working dir). Gitignored; created automatically on first upload.
app.import.directory=imports